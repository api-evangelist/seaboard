name: Seaboard
aid: seaboard
description: Seaboard Corporation is a diversified global agribusiness and transportation holding company headquartered
  in Merriam, Kansas, operating through Seaboard Foods (pork production and processing), Seaboard Marine (containerized
  ocean cargo between the United States, the Caribbean, and Central and South America), Seaboard Overseas and Trading
  Group (grain merchandising and milling), Seaboard Energy (renewable diesel), Transcontinental Capital Corporation
  (electric power generation in the Dominican Republic), Mount Dora Farms, and a minority interest in Butterball.
  Seaboard publishes no public developer API or developer portal; its only documented machine-to-machine integration
  surface is the Seaboard Marine Electronic Data Interchange program, which publishes an ANSI ASC X12 and UN/EDIFACT
  transaction-set catalog and onboards trading partners through a request form.
