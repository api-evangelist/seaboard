description: >-
  Seaboard Corporation publishes no API plans, tiers, quotas or developer pricing, because it
  publishes no API. Every page in both sitemaps was enumerated; there is no pricing page for a
  developer product anywhere in the group. What Seaboard Marine does publish commercially is
  ocean freight tariff material — a rate search, a rate request form, a commodity list, tariff
  rules, demurrage and detention terms, and fuel surcharges — which is cargo pricing for
  shippers, not metered API pricing for integrators. Access to the Seaboard Marine EDI program
  and the MySeaboard portal is a trading-partner relationship, not a purchasable plan.
notes:
