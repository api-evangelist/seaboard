description: >-
  Seaboard Corporation documents no rate limits, quotas, throttling policy or exhaustion
  response, because it operates no HTTP API. There are no X-RateLimit-* or RateLimit-* headers
  to record and no 429 semantics to describe. The group's only machine-to-machine surface is
  batch EDI, where throughput is governed by the bilateral trading-partner agreement rather
  than by a published per-key envelope, and where delivery is acknowledged with the ANSI X12
  997 Functional Acknowledgement instead of an HTTP status code.
